version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbin_school
      POSTGRES_USER: orbin
      POSTGRES_PASSWORD: orbin_secure_prod_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbin -d orbin_school"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./orbin-backend
      dockerfile: Dockerfile
    container_name: orbin-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/orbin_school
      DATABASE_USERNAME: orbin
      DATABASE_PASSWORD: orbin_secure_prod_password
      PORT: 8080
      JWT_SECRET: c29tZXZlcnlzZWN1cmVwcm9kdWN0aW9uand0c2VjcmV0a2V5b3JiaW5zYWFzMjAyNg==
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./orbin-frontend
      dockerfile: Dockerfile
    container_name: orbin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
